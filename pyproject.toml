[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ragents"
version = "0.2.0.dev3"
description = "R Agents: sağlayıcıdan bağımsız yerel ajan çekirdeği"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic-ai-slim[openai]==2.64.0",
    "PyYAML>=6.0.2,<7",
    "keyring>=25.6,<27",
    "filelock>=3.18,<4",
    "cryptography>=46,<49",
    "mcp>=2.3,<3",
    "jsonschema>=4.20,<5",
    "httpx2>=2.10,<3",
    "croniter==6.2.4",
    "tzdata>=2026.6; sys_platform == 'win32'",
    "playwright==1.64.1",
    "tomlkit==0.15.2",
    "json5==0.17.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
ragents = "ragents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
