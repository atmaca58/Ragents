schema_version: 2
connections:
  router:
    provider: openrouter
    # Kendi hesabınızda desteklenen model kimliğini yazın.
    model: vendor/model
    api_key_env: OPENROUTER_API_KEY
agent:
  id: ornek-ajan
  name: Örnek Ajan
  instructions: Türkçe yanıt ver. Bilmediğini belirt. Gereksiz uzatma.
  connection: router
  tools: [text_stats]
  budget:
    request_limit: 4
    tool_calls_limit: 2
    output_tokens_limit: 1024
    timeout_seconds: 60
